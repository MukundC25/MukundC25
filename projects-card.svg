<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 414" width="800" height="414">
  <style>
    @keyframes rowFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .proj-row {
      opacity: 0;
      animation: rowFadeIn 0.4s ease forwards;
    }
    .pr-0 { animation-delay: 0.00s; }
    .pr-1 { animation-delay: 0.18s; }
    .pr-2 { animation-delay: 0.36s; }
    .pr-3 { animation-delay: 0.54s; }
    .pr-4 { animation-delay: 0.72s; }
    .pr-5 { animation-delay: 0.90s; }
  </style>
  <rect x="0" y="0" width="800" height="414" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <g class="proj-row pr-0">
    <rect x="0" y="0" width="800" height="40" rx="8" fill="#161b22" />
    <rect x="0" y="32" width="800" height="8" fill="#161b22" />
    <circle cx="20" cy="20.0" r="5" fill="#ff5f56" />
    <circle cx="36" cy="20.0" r="5" fill="#ffbd2e" />
    <circle cx="52" cy="20.0" r="5" fill="#27c93f" />
