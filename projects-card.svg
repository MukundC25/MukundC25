    <text x="480" y="268.2" font-family="'Courier New', monospace" font-size="12.5" fill="#8b949e">Supabase</text>
  </g>
  <line x1="0" y1="286" x2="800" y2="286" stroke="#21262d" stroke-width="0.5" />
  <rect x="0" y="286" width="800" height="60" fill="#11151c" />
  <g class="proj-row pr-4">
    <text x="20" y="320.1666666666667" font-family="'Courier New', monospace" font-size="12.5" font-weight="bold" fill="#f78166" text-decoration="underline">Apta</text>
    <text x="120" y="312.2" font-family="'Courier New', monospace" font-size="12.5" fill="#c9d1d9">Smart lifestyle recommender — TF-IDF +</text>
    <text x="120" y="328.2" font-family="'Courier New', monospace" font-size="12.5" fill="#c9d1d9">cosine similarity</text>
    <text x="480" y="312.2" font-family="'Courier New', monospace" font-size="12.5" fill="#8b949e">Next.js, FastAPI,</text>
    <text x="480" y="328.2" font-family="'Courier New', monospace" font-size="12.5" fill="#8b949e">scikit-learn</text>
  </g>
  <line x1="0" y1="346" x2="800" y2="346" stroke="#21262d" stroke-width="0.5" />
  <g class="proj-row pr-5">
    <text x="20" y="380.1666666666667" font-family="'Courier New', monospace" font-size="12.5" font-weight="bold" fill="#ffa657" text-decoration="underline">V-Track</text>
    <text x="120" y="372.2" font-family="'Courier New', monospace" font-size="12.5" fill="#c9d1d9">Vehicle tracking &amp; security with ESP32 +</text>
    <text x="120" y="388.2" font-family="'Courier New', monospace" font-size="12.5" fill="#c9d1d9">Google Geolocation</text>
    <text x="480" y="372.2" font-family="'Courier New', monospace" font-size="12.5" fill="#8b949e">React, Flask, Google</text>
    <text x="480" y="388.2" font-family="'Courier New', monospace" font-size="12.5" fill="#8b949e">Maps API, Docker</text>
