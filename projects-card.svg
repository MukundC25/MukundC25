    <text x="120" y="116.2" font-family="'Courier New', monospace" font-size="12.5" fill="#c9d1d9">5-node LangGraph pipeline with FAISS +</text>
    <text x="120" y="132.2" font-family="'Courier New', monospace" font-size="12.5" fill="#c9d1d9">Neo4j GraphRAG</text>
    <text x="480" y="108.2" font-family="'Courier New', monospace" font-size="12.5" fill="#8b949e">Python, FastAPI,</text>
    <text x="480" y="124.2" font-family="'Courier New', monospace" font-size="12.5" fill="#8b949e">LangGraph, Llama3, Neo4j</text>
  </g>
  <line x1="0" y1="150" x2="800" y2="150" stroke="#21262d" stroke-width="0.5" />
  <rect x="0" y="150" width="800" height="60" fill="#11151c" />
  <g class="proj-row pr-2">
    <text x="20" y="184.16666666666666" font-family="'Courier New', monospace" font-size="12.5" font-weight="bold" fill="#d2a8ff" text-decoration="underline">Refine</text>
